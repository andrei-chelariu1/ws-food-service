[alembic]
script_location = migrations

# Revision filenames get a zero-padded numeric prefix so `ls versions/` sorts
# in apply order. Alembic's default (bare hash) tells you nothing at a glance.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .

# NOTE: sqlalchemy.url is deliberately EMPTY.
# migrations/env.py reads DATABASE_URL from app.core.config.Settings instead,
# so the connection string lives in exactly one place (DRY) and secrets never
# sit in a committed file. See docs/adr/0003-async-alembic-single-driver.md.
sqlalchemy.url =

[post_write_hooks]
# Autogenerated migrations get formatted like the rest of the codebase.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
