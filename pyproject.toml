[project]
name = "food-waste-app"
version = "0.1.0"
description = "Food Waste App backend — feature-based modular FastAPI reference implementation"
requires-python = ">=3.12"

# --------------------------------------------------------------------------
# Runtime dependencies, grouped by the architecture layer they serve.
# Deliberate deviations from ARCHITECTURE.md are recorded in docs/adr/.
# --------------------------------------------------------------------------
dependencies = [
    # API / controller layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",

    # Repository layer — one driver only (asyncpg). See docs/adr/0003.
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "alembic>=1.13",

    # Security — PyJWT + bcrypt. See docs/adr/0001 and docs/adr/0002.
    "pyjwt>=2.9",
    "bcrypt>=4.2",

    # Cross-cutting
    "redis>=5.0",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "faker>=30.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------
# ruff — replaces flake8 + black + isort (one tool, one config: DRY)
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # async correctness (e.g. blocking calls in async defs)
    "S",        # bandit security rules
    "T20",      # no print()
    "RUF",
]
ignore = [
    "S101",  # assert — used intentionally in tests and startup guards
    "B008",  # function call in default arg — this is exactly how FastAPI Depends() works
    # PEP 695 `class Page[T]` instead of `Generic[T]`. Not adopted: Pydantic's generic
    # model machinery and FastAPI's OpenAPI schema generation are both better tested
    # against the `Generic[T]` form, and `Page[T]` is on the response path of every
    # list endpoint. A cosmetic modernisation is not worth the risk there.
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use hardcoded passwords and asserts freely.
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["S105", "S106"]

[tool.ruff.format]
# Ruff also formats Python fenced code blocks inside Markdown. That is a nice
# feature for tutorials and the wrong one for us: our docs deliberately align
# trailing comments into columns to annotate a signature line by line, and the
# formatter collapses that alignment to a single space. The docs are prose about
# code, not code — so `ruff format --check .` stays green and the tables stay
# readable. Linting still covers every real .py file.
exclude = ["*.md"]

# --------------------------------------------------------------------------
# mypy — strict, because clear module boundaries are only real if enforced
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/", "^tests/"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "jwt.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: hits the database through the ASGI app",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*"]
